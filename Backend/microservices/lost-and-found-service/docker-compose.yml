services:

  postgres:
    image: postgres:16
    container_name: lostfound-postgres
    environment:
      POSTGRES_DB: lostfound_db
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: