spring.application.name=lost-and-found-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5440/lostfound_db
spring.datasource.username=lostfound
spring.datasource.password=lostfound

spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.server.enable-self-preservation=false
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=lost-and-found-service
info.app.description=Signalements d'animaux perdus et trouvés
info.app.version=1.0.0
server.forward-headers-strategy=framework
