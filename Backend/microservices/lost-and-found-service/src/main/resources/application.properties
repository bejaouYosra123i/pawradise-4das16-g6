
spring.application.name=lost-and-found-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3309/lostfound_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=lost-and-found-service
info.app.description=Signalements d'animaux perdus et trouvés
info.app.version=1.0.0
