spring.application.name=vetcare-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5439/vetcare_db
spring.datasource.username=vetcare
spring.datasource.password=vetcare
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true

info.app.name=vetcare-service
info.app.version=1.0.0
info.app.description=Microservice VetCare - cliniques, dossiers medicaux et vaccinations
info.app.team=Pawradise 4DAS16-G6
management.health.rabbit.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/