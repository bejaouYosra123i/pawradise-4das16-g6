# ---------- GATEWAY ----------
spring.application.name=api-gateway
server.port=8888

# ---------- EUREKA (les 2 serveurs) ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------- ROUTES ----------
spring.cloud.gateway.server.webflux.routes[0].id=LOST-AND-FOUND
spring.cloud.gateway.server.webflux.routes[0].uri=lb://lost-and-found-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/lost-found/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=ADOPTION
spring.cloud.gateway.server.webflux.routes[1].uri=lb://adoption-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/adoption/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=ANIMAL-RESCUE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://animal-rescue-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/rescue/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=VETCARE
spring.cloud.gateway.server.webflux.routes[3].uri=lb://vetcare-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/vetcare/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=MARKETPLACE
spring.cloud.gateway.server.webflux.routes[4].uri=lb://marketplace
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/marketplace/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=DONATION
spring.cloud.gateway.server.webflux.routes[5].uri=lb://donation-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/donation/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

# ---------- LOGS : voir quelle instance est choisie ----------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ---------- SWAGGER UNIFIÉ ----------
springdoc.swagger-ui.urls[0].name=Lost & Found
springdoc.swagger-ui.urls[0].url=/lost-found/v3/api-docs
springdoc.swagger-ui.urls[1].name=Adoption
springdoc.swagger-ui.urls[1].url=/adoption/v3/api-docs
springdoc.swagger-ui.urls[2].name=Animal Rescue
springdoc.swagger-ui.urls[2].url=/rescue/v3/api-docs
springdoc.swagger-ui.urls[3].name=VetCare
springdoc.swagger-ui.urls[3].url=/vetcare/v3/api-docs
springdoc.swagger-ui.urls[4].name=Marketplace
springdoc.swagger-ui.urls[4].url=/marketplace/v3/api-docs
springdoc.swagger-ui.urls[5].name=Donation
springdoc.swagger-ui.urls[5].url=/donation/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Lost & Found



