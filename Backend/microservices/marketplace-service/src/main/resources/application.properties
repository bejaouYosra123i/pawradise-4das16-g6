spring.application.name=marketplace
server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Transmettre le statut de /health a Eureka (DOWN si la base ou RabbitMQ tombe)
eureka.client.healthcheck.enabled=true

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=marketplace
spring.datasource.password=marketplace
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# Contenu de /actuator/info
management.info.env.enabled=true
info.app.name=marketplace
info.app.version=1.0.0
info.app.description=Microservice Marketplace de Pawradise
info.app.team=Pawradise - 4DAS16 groupe 6