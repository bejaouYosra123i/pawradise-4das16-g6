
spring.application.name=animal-rescue-service

# Port de la première instance
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5431/animalrescue_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka Client
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Identifiant unique pour chaque instance
eureka.instance.instance-id=${spring.application.name}:${server.port}
