spring.application.name=animal-rescue-service

# Port de la première instance (la 2e instance utilise le profil instance2 : port 8092)
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5431/animalrescue_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=animal-rescue-service
info.app.description=Microservice Animal Rescue - Pawradise
info.app.version=0.0.1

# Eureka Client (2 serveurs Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Identifiant unique pour chaque instance
eureka.instance.instance-id=${spring.application.name}:${server.port}